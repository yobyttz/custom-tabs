name: Build

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK (manual)
        uses: android-actions/setup-android@v3
        with:
          packages: ""   # no instalar "tools" roto
          accept-android-sdk-licenses: true

      - name: Install platform + NDK
        run: |
          set -e
          export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-28" "ndk;28.2.13676358" "cmake;3.22.1"
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Build arm64 levipack
        run: |
          set -e
          export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          test -d "$ANDROID_NDK_HOME"
          TOOLCHAIN="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake"

          cmake -S . -B build-config -G Ninja
          cmake --build build-config --target levi_generate_config
          CONFIG_DIR="$PWD/build-config/generated-config"

          cmake -S . -B build-arm64-v8a -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DANDROID_STL=c++_shared \
            -DLEVI_PACKAGE_CONFIG_DIR="$CONFIG_DIR"

          cmake --build build-arm64-v8a --target levi_package
          ls -la build-arm64-v8a/*.levipack

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mod-arm64
          path: build-arm64-v8a/*.levipack
